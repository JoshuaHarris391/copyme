name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The ends of the supported range in pyproject.toml, plus the version
        # development happens on. spaCy and its model are the parts most likely
        # to break on a new Python, so the upper bound is worth testing.
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        # --with dev is required: the dev dependencies use PEP 735
        # [dependency-groups], which a plain `poetry install` does not pick up.
        # en_core_web_sm is a URL dependency, so the spaCy model needs no
        # separate download step.
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with dev

      - name: Run the tests
        # The nltk nps_chat corpus is deliberately not downloaded. analyser.py
        # falls back to a built-in list without it, and that fallback is the
        # path the tests are written against.
        run: poetry run python3 -m pytest -q

  baseline:
    # baseline.json is a build artefact committed by hand, so it can drift from
    # the corpus it claims to describe without anything noticing. This job
    # recomputes it and fails if the two disagree. It sits outside the pytest
    # job because it parses the whole 391,398-word corpus. It writes nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with dev

      - name: Check baseline.json still matches the corpus
        run: poetry run python3 scripts/build_baseline.py --verify
