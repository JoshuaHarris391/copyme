[tool.poetry]
name = "copyme"
version = "2.0.0"
description = ""
authors = []
package-mode = true

[[tool.poetry.packages]]
include = "copyme"
from = "src"

[tool.poetry.scripts]
copyme = "copyme.cli:main"

[tool.poetry.extras]
# The only part of copyme that downloads a model. score() must keep working
# with no network, so the embedding check stays behind an extra.
embeddings = ["sentence-transformers"]

[tool.poetry.dependencies]
sentence-transformers = { version = ">=3.0.0", optional = true }
python = ">=3.10,<3.14"
spacy = ">=3.8.11"
textstat = ">=0.7.12"
empath = ">=0.41"
en-core-web-sm = {url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"}
nltk = ">=3.9.2"
streamlit = ">=1.43.0"



[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.1.0,<8.0.0)",
    "pytest (>=8.0.0,<9.0.0)",
    # Validates the exported Character Card V2 against the schema fixture in
    # tests/fixtures. Declared explicitly rather than relied on through
    # Streamlit, which happens to pull it in today.
    "jsonschema (>=4.0.0,<5.0.0)",
    # Needed by scripts/generate_baseline_corpus.py, and by the live contrastive
    # tier. A dev dependency rather than a runtime one: the library imports it
    # lazily and degrades to the static tier without it, and no part of copyme
    # that a user touches requires an API key.
    "anthropic (>=0.40.0)"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
